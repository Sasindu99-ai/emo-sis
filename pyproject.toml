[project]
name = "emo-sis"
version = "0.1.0"
description = "Multimodal Patient Distress Monitoring (Facial, Audio, and Text Fusion)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "torchaudio>=2.2.0",
    "librosa>=0.10.1",
    "soundfile>=0.12.1",
    "noisereduce>=3.0.0",
    "opencv-python>=4.9.0",
    "Pillow>=10.2.0",
    "openai-whisper>=20231117",
    "SpeechRecognition>=3.10.1",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.4.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "python-multipart>=0.0.9",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0.0",
    "ipykernel>=6.29.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai"]
